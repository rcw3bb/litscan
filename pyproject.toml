[project]
name = "litscan"
version = "2.1.0"
description = "A small CLI tool that scans a codebase for string and numeric literals, helping you quickly spot hard-coded values in source files."
authors = [
    {name = "Ron Webb",email = "ron@ronella.xyz"}
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.14"
dependencies = [
    "rich (>=15.0.0,<16.0.0)",
    "click (>=8.0.0,<9.0.0)",
    "logenrich (>=1.0.1,<2.0.0)",
    "env-dir-bootstrap (>=1.0.0,<2.0.0)",
    "tree-sitter (>=0.26.0,<0.27.0)",
    "tree-sitter-python (>=0.25.0,<0.26.0)",
    "tree-sitter-javascript (>=0.25.0,<0.26.0)",
    "tree-sitter-typescript (>=0.23.2,<0.24.0)",
    "tree-sitter-java (>=0.23.5,<0.24.0)",
    "tree-sitter-go (>=0.25.0,<0.26.0)",
    "tree-sitter-gosu (>=0.2.0,<0.3.0)",
    "tree-sitter-c (>=0.24.2,<0.25.0)",
    "tree-sitter-cpp (>=0.23.4,<0.24.0)",
    "tree-sitter-c-sharp (>=0.23.5,<0.24.0)",
    "tree-sitter-rust (>=0.24.2,<0.25.0)",
    "tree-sitter-kotlin (>=1.1.0,<2.0.0)",
    "tree-sitter-swift (>=0.7.3,<0.8.0)",
    "tree-sitter-scala (>=0.26.2,<0.27.0)",
    "tree-sitter-groovy (>=0.1.2,<0.2.0)",
    "braincraft (>=1.3.0,<2.0.0)"
]

[project.scripts]
litscan = "litscan.cli:main"

[tool.poetry]
packages = [{include = "litscan"}]
include = ["CHANGELOG.md"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "pylint (>=4.0.5,<5.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
